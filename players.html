<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP League | Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg2: #222;
      --bg3: #2a2a2a;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --muted: #999;
      --blue: #00a0e3;
      --green: #00c853;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      display: block;
    }

    .logo-text {
      font-size: 1rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 0.15rem;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-tab.active {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--text);
    }

    /* Hide logo + name on phone */
    @media (max-width: 767px) {
      .header-top {
        display: none;
      }

      .header-inner {
        padding: 0.5rem 0.75rem;
      }
    }

    /* Main */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 0.75rem;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Players Grid */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.85rem;
    }

    .player-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid transparent;
    }

    .player-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg3);
      display: block;
    }

    .player-info {
      padding: 0.75rem 0.85rem 0.9rem;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
    }

    .player-team {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .team-badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      object-fit: contain;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .players-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.65rem;
      }

      .player-name {
        font-size: 0.85rem;
      }
    }

    /* Desktop */
    @media (min-width: 768px) {
      .header-inner {
        flex-direction: row;
        align-items: center;
        height: 60px;
        padding: 0 1rem;
      }

      .nav-tabs {
        justify-content: flex-end;
        flex: 1;
      }

      .logo-text {
        font-size: 1.1rem;
      }

      .container {
        padding: 1.25rem 1rem;
      }

      .page-title {
        font-size: 1.35rem;
      }

      .players-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-top">
        <a href="index.html" class="logo">
          <img class="logo-icon" src="vp.png" alt="VP League">
          <span class="logo-text">VP League</span>
        </a>
      </div>
      <nav class="nav-tabs">
        <a href="news.html" class="nav-tab">Home</a>
        <a href="table.html" class="nav-tab">Table</a>
        <a href="matches.html" class="nav-tab">Matches</a>
        <a href="#" class="nav-tab">Stats</a>
        <a href="#" class="nav-tab active">Players</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Players</h1>
      <div class="filters">
        <button class="filter-btn active">All</button>
      </div>
    </div>

    <div class="players-grid">
      <div class="player-card">
        <img class="player-img" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p223094.png" alt="Erling Haaland">
        <div class="player-info">
          <div class="player-name">Erling Haaland</div>
          <div class="player-team">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t43.png" alt="Man City">
            Man City
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
