<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP League | Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg2: #222;
      --bg3: #2a2a2a;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --muted: #999;
      --blue: #00a0e3;
      --orange: #ff6d00;
      --red: #ff1744;
      --green: #00c853;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
      flex-shrink: 0;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: contain;
      display: block;
      background: #222;
    }

    .logo-text {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--text);
    }

    /* Main */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.25rem 1rem;
    }

    .page-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.25rem;
      align-items: start;
    }

    /* Season */
    .season-bar {
      background: var(--bg3);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .season-bar b {
      color: var(--text);
      font-weight: 600;
    }

    /* Table */
    .table-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
    }

    thead th {
      padding: 0.75rem 0.6rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead th.center { text-align: center; }
    thead th.pts { color: var(--text); font-weight: 700; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 0.7rem 0.6rem;
      font-size: 0.85rem;
      vertical-align: middle;
    }

    td.center { text-align: center; }
    td.pts { font-weight: 700; font-size: 0.9rem; }

    .pos-cell {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .club-cell {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 600;
    }

    .club-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      flex-shrink: 0;
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .side-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }

    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .side-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .stat-tabs {
      display: flex;
      gap: 0;
      padding: 0 1rem;
      border-bottom: 1px solid var(--border);
    }

    .stat-tab {
      padding: 0.65rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .stat-tab.active {
      color: var(--text);
      border-bottom-color: var(--blue);
    }

    .stat-list { padding: 0.4rem 0; }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 1rem;
    }

    .stat-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg3);
      object-fit: cover;
      flex-shrink: 0;
    }

    .stat-info { flex: 1; min-width: 0; }

    .stat-name {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .stat-team {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stat-value {
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .header-inner {
        height: 54px;
      }

      .logo-text {
        font-size: 1rem;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
      }

      .nav-tabs {
        gap: 0.25rem;
      }

      .nav-tab {
        padding: 0.35rem 0.7rem;
        font-size: 0.75rem;
      }

      .container {
        padding: 1rem 0.75rem;
      }

      .page-title {
        font-size: 1.2rem;
      }

      table {
        min-width: 500px;
      }

      th, td {
        padding: 0.6rem 0.5rem;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 400px) {
      .nav-tab {
        padding: 0.3rem 0.55rem;
        font-size: 0.7rem;
      }

      .logo-text {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="#" class="logo">
        <img class="logo-icon" src="https://your-site.com/logo.png" alt="VP League">
        <span class="logo-text">VP League</span>
      </a>
      <nav class="nav-tabs">
        <a href="#" class="nav-tab active">Table</a>
        <a href="#" class="nav-tab">Matches</a>
        <a href="#" class="nav-tab">Stats</a>
        <a href="#" class="nav-tab">Players</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Table</h1>

    <div class="main-grid">
      <!-- Left: Table -->
      <div>
        <div class="season-bar">
          Season <b>2026-27</b>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Club</th>
                  <th class="center">MP</th>
                  <th class="center">W</th>
                  <th class="center">D</th>
                  <th class="center">L</th>
                  <th class="center">GF</th>
                  <th class="center">GA</th>
                  <th class="center">GD</th>
                  <th class="center pts">Pts</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="pos-cell">
                      <div class="club-cell">
                        <img class="club-badge" src="https://resources.premierleague.com/premierleague/badges/t3.png" alt="Arsenal">
                        Arsenal
                      </div>
                    </div>
                  </td>
                  <td class="center">4</td>
                  <td class="center">4</td>
                  <td class="center">0</td>
                  <td class="center">0</td>
                  <td class="center">8</td>
                  <td class="center">1</td>
                  <td class="center">7</td>
                  <td class="center pts">12</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Right Sidebar -->
      <div class="sidebar">
        <div class="side-card">
          <div class="side-header">
            <h3>Stat Leaders</h3>
          </div>
          <div class="stat-tabs">
            <button class="stat-tab active">Goals</button>
          </div>
          <div class="stat-list">
            <div class="stat-row">
              <img class="stat-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p223094.png" alt="Haaland">
              <div class="stat-info">
                <div class="stat-name">Erling Haaland</div>
                <div class="stat-team">Man City</div>
              </div>
              <span class="stat-value">4</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
