<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP League | Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg2: #222;
      --bg3: #2a2a2a;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --muted: #999;
      --blue: #00a0e3;
      --green: #00c853;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header-top {
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      display: block;
    }

    .logo-text {
      font-size: 1rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 0.15rem;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-tab:hover { color: var(--text); }

    .nav-tab.active {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--text);
    }

    /* Hide logo + name on phone */
    @media (max-width: 767px) {
      .header-top {
        display: none;
      }

      .header-inner {
        padding: 0.5rem 0.75rem;
      }
    }

    /* Main */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 0.75rem;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.9rem;
    }

    .main-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .season-bar {
      background: var(--bg3);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .season-bar b {
      color: var(--text);
      font-weight: 600;
    }

    .table-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    thead th {
      padding: 0.7rem 0.5rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead th.center { text-align: center; }
    thead th.pts { color: var(--text); font-weight: 700; }

    tbody tr {
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 0.65rem 0.5rem;
      font-size: 0.8rem;
      vertical-align: middle;
    }

    td.center { text-align: center; }
    td.pts { font-weight: 700; font-size: 0.85rem; }

    .club-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }

    .club-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      flex-shrink: 0;
    }

    .side-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }

    .side-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .side-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .stat-tabs {
      display: flex;
      padding: 0 1rem;
      border-bottom: 1px solid var(--border);
    }

    .stat-tab {
      padding: 0.6rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .stat-tab.active {
      color: var(--text);
      border-bottom-color: var(--blue);
    }

    .stat-list { padding: 0.4rem 0; }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.6rem 1rem;
    }

    .stat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg3);
      object-fit: cover;
      flex-shrink: 0;
    }

    .stat-info { flex: 1; min-width: 0; }

    .stat-name {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .stat-team {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stat-value {
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Desktop */
    @media (min-width: 768px) {
      .header-inner {
        flex-direction: row;
        align-items: center;
        height: 60px;
        padding: 0 1rem;
      }

      .nav-tabs {
        justify-content: flex-end;
        flex: 1;
      }

      .logo-text {
        font-size: 1.1rem;
      }

      .container {
        padding: 1.25rem 1rem;
      }

      .page-title {
        font-size: 1.35rem;
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-top">
        <a href="index.html" class="logo">
          <img class="logo-icon" src="vp.png" alt="VP League">
          <span class="logo-text">VP League</span>
        </a>
      </div>
      <nav class="nav-tabs">
        <a href="#" class="nav-tab active">Table</a>
        <a href="matches.html" class="nav-tab">Matches</a>
        <a href="stats.html" class="nav-tab">Stats</a>
        <a href="players.html" class="nav-tab">Players</a>
        <a href="news.html" class="nav-tab">News</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Table</h1>

    <div class="main-grid">
      <div>
        <div class="season-bar">
          Season <b>2026-27</b>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Club</th>
                  <th class="center">MP</th>
                  <th class="center">W</th>
                  <th class="center">D</th>
                  <th class="center">L</th>
                  <th class="center">GF</th>
                  <th class="center">GA</th>
                  <th class="center">GD</th>
                  <th class="center pts">Pts</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="club-cell">
                      <img class="club-badge" src="https://resources.premierleague.com/premierleague/badges/t3.png" alt="Arsenal">
                      Arsenal
                    </div>
                  </td>
                  <td class="center">4</td>
                  <td class="center">4</td>
                  <td class="center">0</td>
                  <td class="center">0</td>
                  <td class="center">8</td>
                  <td class="center">1</td>
                  <td class="center">7</td>
                  <td class="center pts">12</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="side-card">
        <div class="side-header">
          <h3>Stat Leaders</h3>
        </div>
        <div class="stat-tabs">
          <button class="stat-tab active">Goals</button>
        </div>
        <div class="stat-list">
          <div class="stat-row">
            <img class="stat-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p223094.png" alt="Haaland">
            <div class="stat-info">
              <div class="stat-name">Erling Haaland</div>
              <div class="stat-team">Man City</div>
            </div>
            <span class="stat-value">4</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
