<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP League | Matches</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg2: #222;
      --bg3: #2a2a2a;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --muted: #999;
      --blue: #00a0e3;
      --green: #00c853;
      --red: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      display: block;
    }

    .logo-text {
      font-size: 1rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 0.15rem;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-tab.active {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--text);
    }

    /* Hide logo + name on phone */
    @media (max-width: 767px) {
      .header-top {
        display: none;
      }

      .header-inner {
        padding: 0.5rem 0.75rem;
      }
    }

    /* Main */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 0.75rem;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 0.4rem;
    }

    .filter-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Matchday */
    .matchday {
      margin-bottom: 1.5rem;
    }

    .matchday-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .match-card {
      background: var(--card);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      border: 1px solid transparent;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .team.home { justify-content: flex-end; text-align: right; }
    .team.away { justify-content: flex-start; }

    .team-name {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .team-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      flex-shrink: 0;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      min-width: 70px;
    }

    .match-status {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .status-ns {
      background: var(--bg3);
      color: var(--blue);
    }

    .status-ft {
      background: var(--bg3);
      color: var(--muted);
    }

    .match-time {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Mobile cards */
    @media (max-width: 600px) {
      .match-card {
        grid-template-columns: 1fr;
        gap: 0.55rem;
        text-align: center;
      }

      .team.home,
      .team.away {
        justify-content: center;
      }

      .team.home { order: 1; }
      .score-box { order: 2; }
      .team.away { order: 3; }
    }

    /* Desktop */
    @media (min-width: 768px) {
      .header-inner {
        flex-direction: row;
        align-items: center;
        height: 60px;
        padding: 0 1rem;
      }

      .nav-tabs {
        justify-content: flex-end;
        flex: 1;
      }

      .logo-text {
        font-size: 1.1rem;
      }

      .container {
        padding: 1.25rem 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-top">
        <a href="index.html" class="logo">
          <img class="logo-icon" src="vp.png" alt="VP League">
          <span class="logo-text">VP League</span>
        </a>
      </div>
      <nav class="nav-tabs">
        <a href="table.html" class="nav-tab">Table</a>
        <a href="#" class="nav-tab active">Matches</a>
        <a href="#" class="nav-tab">Stats</a>
        <a href="#" class="nav-tab">Players</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Matches</h1>
      <div class="filters">
        <button class="filter-btn active">Fixtures</button>
        <a href="result.html" class="filter-btn">Results</a>
      </div>
    </div>

    <div class="matchday">
      <div class="matchday-title">Matchday</div>
      <div class="matches-list">
        <div class="match-card">
          <div class="team home">
            <span class="team-name">Brighton</span>
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t36.png" alt="Brighton">
          </div>
          <div class="score-box">
            <div class="match-time">15:00</div>
            <span class="match-status status-ns">NS</span>
          </div>
          <div class="team away">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t14.png" alt="Liverpool">
            <span class="team-name">Liverpool</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
