<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP League | Admin News</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #fff;
      --muted: #888;
      --accent: #00d26a;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1rem;
    }

    .logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
    }

    .logo span.badge {
      font-size: 0.6rem;
      background: var(--accent);
      color: #111;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 800;
    }

    .back-btn {
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    /* Main */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .page-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }

    /* Section */
    .section {
      margin-bottom: 2.5rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .section-header h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .btn {
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-add {
      background: var(--accent);
      color: #111;
    }

    .btn-add:hover { opacity: 0.9; }

    .btn-update {
      background: var(--blue);
      color: #fff;
    }

    .btn-delete {
      background: var(--red);
      color: #fff;
    }

    .btn-cancel {
      background: var(--border);
      color: var(--text);
    }

    .btn-sm {
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
    }

    /* Featured news */
    .featured-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .featured-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #222;
      display: block;
    }

    .featured-body {
      padding: 1.15rem;
    }

    .tag {
      display: inline-block;
      background: var(--accent);
      color: #111;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .featured-body h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .featured-body p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Small news */
    .small-grid {
      display: grid;
      gap: 1rem;
    }

    .small-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 110px 1fr;
    }

    .small-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      min-height: 100px;
      background: #222;
    }

    .small-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .small-body .tag {
      background: transparent;
      color: var(--accent);
      padding: 0;
      margin-bottom: 0.25rem;
    }

    .small-body h3 {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .form-group input[type="file"] {
      padding: 0.5rem;
      font-size: 0.8rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .modal-actions .btn {
      flex: 1;
      padding: 0.65rem;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .featured-img { height: 180px; }

      .small-card {
        grid-template-columns: 90px 1fr;
      }

      .page-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="admin.html" class="logo">
        <img src="vp.png" alt="VP">
        VP League
        <span class="badge">ADMIN</span>
      </a>
      <a href="admin.html" class="back-btn">← Dashboard</a>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Manage News</h1>

    <!-- ========== BIG / FEATURED NEWS ========== -->
    <div class="section">
      <div class="section-header">
        <h2>Big News (Featured)</h2>
        <button class="btn btn-add" onclick="openModal('featured')">+ Add</button>
      </div>

      <div id="featured-list">
        <!-- Example featured news -->
        <div class="featured-card" id="featured-1">
          <img class="featured-img" src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&q=80" alt="News">
          <div class="featured-body">
            <span class="tag">Breaking</span>
            <h3>Arsenal stun Man City to seize top spot</h3>
            <p>A dramatic late winner sends the Gunners three points clear at the summit of the VP League.</p>
            <div class="card-actions">
              <button class="btn btn-update btn-sm" onclick="openModal('featured', true)">Update</button>
              <button class="btn btn-delete btn-sm" onclick="deleteItem('featured-1')">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== SMALL NEWS ========== -->
    <div class="section">
      <div class="section-header">
        <h2>Small News</h2>
        <button class="btn btn-add" onclick="openModal('small')">+ Add</button>
      </div>

      <div class="small-grid" id="small-list">
        <!-- Example small news -->
        <div class="small-card" id="small-1">
          <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=300&q=80" alt="">
          <div class="small-body">
            <span class="tag">Match</span>
            <h3>Haaland brace not enough for City</h3>
            <div class="card-actions">
              <button class="btn btn-update btn-sm" onclick="openModal('small', true)">Update</button>
              <button class="btn btn-delete btn-sm" onclick="deleteItem('small-1')">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: Featured News ========== -->
  <div class="modal-overlay" id="modal-featured">
    <div class="modal">
      <h3 id="modal-featured-title">Add Big News</h3>
      <form onsubmit="saveFeatured(event)">
        <div class="form-group">
          <label>Image</label>
          <input type="file" accept="image/*" id="featured-image">
        </div>
        <div class="form-group">
          <label>Tag</label>
          <input type="text" id="featured-tag" placeholder="e.g. Breaking">
        </div>
        <div class="form-group">
          <label>Main Heading</label>
          <input type="text" id="featured-heading" placeholder="Enter main heading" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="featured-desc" placeholder="Enter description" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal('featured')">Cancel</button>
          <button type="submit" class="btn btn-add">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== MODAL: Small News ========== -->
  <div class="modal-overlay" id="modal-small">
    <div class="modal">
      <h3 id="modal-small-title">Add Small News</h3>
      <form onsubmit="saveSmall(event)">
        <div class="form-group">
          <label>Image</label>
          <input type="file" accept="image/*" id="small-image">
        </div>
        <div class="form-group">
          <label>Tag</label>
          <input type="text" id="small-tag" placeholder="e.g. Match">
        </div>
        <div class="form-group">
          <label>Main Heading</label>
          <input type="text" id="small-heading" placeholder="Enter main heading" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal('small')">Cancel</button>
          <button type="submit" class="btn btn-add">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openModal(type, isEdit = false) {
      const modal = document.getElementById('modal-' + type);
      modal.classList.add('open');

      if (type === 'featured') {
        document.getElementById('modal-featured-title').textContent = isEdit ? 'Update Big News' : 'Add Big News';
        if (!isEdit) {
          document.getElementById('featured-tag').value = '';
          document.getElementById('featured-heading').value = '';
          document.getElementById('featured-desc').value = '';
          document.getElementById('featured-image').value = '';
        }
      } else {
        document.getElementById('modal-small-title').textContent = isEdit ? 'Update Small News' : 'Add Small News';
        if (!isEdit) {
          document.getElementById('small-tag').value = '';
          document.getElementById('small-heading').value = '';
          document.getElementById('small-image').value = '';
        }
      }
    }

    function closeModal(type) {
      document.getElementById('modal-' + type).classList.remove('open');
    }

    // Close on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('open');
      });
    });

    function saveFeatured(e) {
      e.preventDefault();
      const tag = document.getElementById('featured-tag').value || 'Breaking';
      const heading = document.getElementById('featured-heading').value;
      const desc = document.getElementById('featured-desc').value;
      const fileInput = document.getElementById('featured-image');
      let imgSrc = 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&q=80';

      if (fileInput.files[0]) {
        imgSrc = URL.createObjectURL(fileInput.files[0]);
      }

      const id = 'featured-' + Date.now();
      const html = `
        <div class="featured-card" id="${id}">
          <img class="featured-img" src="${imgSrc}" alt="News">
          <div class="featured-body">
            <span class="tag">${tag}</span>
            <h3>${heading}</h3>
            <p>${desc}</p>
            <div class="card-actions">
              <button class="btn btn-update btn-sm" onclick="openModal('featured', true)">Update</button>
              <button class="btn btn-delete btn-sm" onclick="deleteItem('${id}')">Delete</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('featured-list').innerHTML = html;
      closeModal('featured');
    }

    function saveSmall(e) {
      e.preventDefault();
      const tag = document.getElementById('small-tag').value || 'Match';
      const heading = document.getElementById('small-heading').value;
      const fileInput = document.getElementById('small-image');
      let imgSrc = 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=300&q=80';

      if (fileInput.files[0]) {
        imgSrc = URL.createObjectURL(fileInput.files[0]);
      }

      const id = 'small-' + Date.now();
      const html = `
        <div class="small-card" id="${id}">
          <img src="${imgSrc}" alt="">
          <div class="small-body">
            <span class="tag">${tag}</span>
            <h3>${heading}</h3>
            <div class="card-actions">
              <button class="btn btn-update btn-sm" onclick="openModal('small', true)">Update</button>
              <button class="btn btn-delete btn-sm" onclick="deleteItem('${id}')">Delete</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('small-list').insertAdjacentHTML('afterbegin', html);
      closeModal('small');
    }

    function deleteItem(id) {
      if (confirm('Are you sure you want to delete this news?')) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }
    }
  </script>
</body>
</html>
