<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP League | Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg2: #222;
      --bg3: #2a2a2a;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --muted: #999;
      --blue: #00a0e3;
      --green: #00c853;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header-top {
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #222;
      display: block;
    }

    .logo-text {
      font-size: 1rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 0.15rem;
    }

    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-tab.active {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--text);
    }

    /* Hide logo on phone */
    @media (max-width: 767px) {
      .header-top { display: none; }
      .header-inner { padding: 0.5rem 0.75rem; }
    }

    /* Main */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 0.75rem;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* Stat tabs */
    .stat-tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stat-tabs::-webkit-scrollbar { display: none; }

    .stat-tab {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .stat-tab.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Scorers list */
    .scorers-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }

    .scorer-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .scorer-row:last-child {
      border-bottom: none;
    }

    .scorer-rank {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 22px;
    }

    .scorer-rank.top {
      color: var(--green);
    }

    .scorer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg3);
      flex-shrink: 0;
    }

    .scorer-info {
      flex: 1;
      min-width: 0;
    }

    .scorer-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .scorer-team {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .team-badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      object-fit: contain;
    }

    .scorer-goals {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--green);
      min-width: 28px;
      text-align: right;
    }

    /* Desktop */
    @media (min-width: 768px) {
      .header-inner {
        flex-direction: row;
        align-items: center;
        height: 60px;
        padding: 0 1rem;
      }

      .nav-tabs {
        justify-content: flex-end;
        flex: 1;
      }

      .logo-text { font-size: 1.1rem; }

      .container {
        padding: 1.25rem 1rem;
      }

      .page-title { font-size: 1.35rem; }

      .scorer-avatar {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-top">
        <a href="index.html" class="logo">
          <img class="logo-icon" src="vp.png" alt="VP League">
          <span class="logo-text">VP League</span>
        </a>
      </div>
      <nav class="nav-tabs">
        <a href="table.html" class="nav-tab">Table</a>
        <a href="matches.html" class="nav-tab">Matches</a>
        <a href="#" class="nav-tab active">Stats</a>
        <a href="players.html" class="nav-tab">Players</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Stats</h1>

    <div class="stat-tabs">
      <button class="stat-tab active">Goals</button>
      <button class="stat-tab">Assists</button>
      <button class="stat-tab">Yellow Cards</button>
      <button class="stat-tab">Red Cards</button>
    </div>

    <div class="scorers-card">
      <!-- 1 -->
      <div class="scorer-row">
        <span class="scorer-rank top">1</span>
        <img class="scorer-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p223094.png" alt="Haaland">
        <div class="scorer-info">
          <div class="scorer-name">Erling Haaland</div>
          <div class="scorer-team">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t43.png" alt="Man City">
            Man City
          </div>
        </div>
        <span class="scorer-goals">4</span>
      </div>

      <!-- 2 -->
      <div class="scorer-row">
        <span class="scorer-rank top">2</span>
        <img class="scorer-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p219961.png" alt="Isak">
        <div class="scorer-info">
          <div class="scorer-name">Alexander Isak</div>
          <div class="scorer-team">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t14.png" alt="Liverpool">
            Liverpool
          </div>
        </div>
        <span class="scorer-goals">3</span>
      </div>

      <!-- 3 -->
      <div class="scorer-row">
        <span class="scorer-rank top">3</span>
        <img class="scorer-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p141746.png" alt="Bruno">
        <div class="scorer-info">
          <div class="scorer-name">Bruno Fernandes</div>
          <div class="scorer-team">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t1.png" alt="Man Utd">
            Man Utd
          </div>
        </div>
        <span class="scorer-goals">3</span>
      </div>

      <!-- 4 -->
      <div class="scorer-row">
        <span class="scorer-rank">4</span>
        <img class="scorer-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p85971.png" alt="Salah">
        <div class="scorer-info">
          <div class="scorer-name">Mohamed Salah</div>
          <div class="scorer-team">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t14.png" alt="Liverpool">
            Liverpool
          </div>
        </div>
        <span class="scorer-goals">2</span>
      </div>

      <!-- 5 -->
      <div class="scorer-row">
        <span class="scorer-rank">5</span>
        <img class="scorer-avatar" src="https://resources.premierleague.com/premierleague/photos/players/250x250/p184341.png" alt="Saka">
        <div class="scorer-info">
          <div class="scorer-name">Bukayo Saka</div>
          <div class="scorer-team">
            <img class="team-badge" src="https://resources.premierleague.com/premierleague/badges/t3.png" alt="Arsenal">
            Arsenal
          </div>
        </div>
        <span class="scorer-goals">2</span>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.stat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.stat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  </script>
</body>
</html>
